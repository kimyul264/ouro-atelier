        const MEMORY_FALLBACK_STORE = {};
        const LIVE_SYNC_CHANNEL =
            typeof window !== "undefined" && "BroadcastChannel" in window

                : null;

        function readStoredJson(key, fallbackValue) {
            try {
                const raw = window.localStorage.getItem(key);
                if (raw !== null && raw !== undefined) {
                    return JSON.parse(raw);
                }
            } catch (_) {}
            if (Object.prototype.hasOwnProperty.call(MEMORY_FALLBACK_STORE, key)) {
                try {
                    return JSON.parse(MEMORY_FALLBACK_STORE[key]);
                } catch (_) {}
            }
            return fallbackValue;
        }

        function writeStoredJson(key, value) {
            try {
                const serialized = JSON.stringify(value);
                MEMORY_FALLBACK_STORE[key] = serialized;
                window.localStorage.setItem(key, serialized);
                if (LIVE_SYNC_CHANNEL) {
                    LIVE_SYNC_CHANNEL.postMessage({ key, value, sentAt: Date.now() });
                }
                return true;
            } catch (_) {
                return false;
            }
        }

        function normalizeImageSrc(rawSrc, fallbackSrc = OUROBOROS_WATCH_SVG) {
            if (typeof rawSrc !== "string") return fallbackSrc;
            const trimmed = rawSrc.trim();
            if (!trimmed) return fallbackSrc;
            if (
                trimmed.startsWith("data:image/") ||
                trimmed.startsWith("blob:") ||
                trimmed.startsWith("http://") ||
                trimmed.startsWith("https://") ||
                trimmed.startsWith("/") ||
                trimmed.startsWith("./")
            ) {
                return trimmed;
            }
            return fallbackSrc;
        }

        function runLocalSiteEditor(commandText, currentConfig, currentWatch) {
            const configUpdates = {};
            const watchUpdates = {};
            const notes = [];

            if (/에메랄드|초록|그린|emerald/i.test(commandText)) {
                configUpdates.themeAccent = "emerald";
                notes.push("에메랄드 다크 테마 적용");
            } else if (/버건디|레드|크림슨|빨강|crimson|rose/i.test(commandText)) {
                configUpdates.themeAccent = "crimson";
                notes.push("버건디 크림슨 테마 적용");
            } else if (/사파이어|블루|파랑|sapphire/i.test(commandText)) {
                configUpdates.themeAccent = "sapphire";
                notes.push("미드나잇 사파이어 테마 적용");
            } else if (/골드|금색|gold/i.test(commandText)) {
                configUpdates.themeAccent = "gold";
                notes.push("로열 골드 테마 적용");
            }

            const manwonMatch = commandText.match(/(\d+(?:,\d+)*)\s*만\s*원/);
            const wonMatch = commandText.match(/(\d+(?:,\d+)*)\s*원/);
            if (manwonMatch) {
                watchUpdates.price = Number(manwonMatch[1].replace(/,/g, "")) * 10000;
                notes.push(`가격 ${watchUpdates.price.toLocaleString()}원으로 변경`);
            } else if (wonMatch) {
                watchUpdates.price = Number(wonMatch[1].replace(/,/g, ""));
                notes.push(`가격 ${watchUpdates.price.toLocaleString()}원으로 변경`);
            }

            if (/예약중|예약 중/.test(commandText)) {
                watchUpdates.status = "예약중";
                notes.push("상태 '예약중'으로 변경");
            } else if (/판매완료|품절|솔드아웃/.test(commandText)) {
                watchUpdates.status = "판매완료";
                notes.push("상태 '판매완료'로 변경");
            } else if (/판매중/.test(commandText)) {
                watchUpdates.status = "판매중";
                notes.push("상태 '판매중'으로 변경");
            }

            const brandMatch = commandText.match(/브랜드(?:명)?(?:을|를)?\s*["']?([A-Za-z0-9가-힣\s·_-]+?)["']?(?:으로|로)\s*바/);
            if (brandMatch && brandMatch[1]) {
                configUpdates.brandLogo = brandMatch[1].trim();
                watchUpdates.brand = brandMatch[1].trim();
                notes.push(`브랜드명 '${configUpdates.brandLogo}' 반영`);
            }

            const bannerMatch = commandText.match(/공지(?:사항|배너)?(?:을|를|에)?\s*["']?([^"'\n]+?)["']?(?:으로|로|라고)\s*(?:바|수정|띄워|등록)/);
            if (bannerMatch && bannerMatch[1]) {
                configUpdates.announcementBanner = bannerMatch[1].trim();
                notes.push("상단 공지 배너 등록");
            }

            if (notes.length === 0) {
                configUpdates.announcementBanner = commandText.trim();
                notes.push("요청 문구를 상단 라이브 공지 배너에 반영했습니다.");
            }

            return {
                summary: notes.join(" · "),
                configUpdates,
                watchUpdates,
            };
        }

        function OuroAtelierApp() {
            const [config, setConfig] = useState(() => ({
                ...DEFAULT_APP_CONFIG,
                ...readStoredJson("ouro_config_v2", DEFAULT_APP_CONFIG),
            }));
            const [watch, setWatch] = useState(() => {
                const loaded = readStoredJson("ouro_watch_v2", INITIAL_WATCH);
                return {
                    ...INITIAL_WATCH,
                    ...loaded,
                    imageUrl: normalizeImageSrc(loaded?.imageUrl, INITIAL_WATCH.imageUrl),
                };
            });
            const [orders, setOrders] = useState(() =>
                readStoredJson("ouro_orders_v2", [])
            );
            const [messages, setMessages] = useState(() =>
                readStoredJson("ouro_messages_v2", [
                    {
                        id: "msg-welcome-1",
                        sender: "admin",
                        senderName: "OURO 관리자",
                        targetEmail: "ALL",
                        text: "안녕하세요. OURO 부티크 1:1 채팅 상담창입니다. 계좌이체 확인 및 시계 관련 문의를 남겨주시면 확인 순서대로 순차 답변해 드립니다.",
                        timestamp: formatTimeNow(),
                    },
                ])
            );
            const [customerSession, setCustomerSession] = useState(() =>
                readStoredJson("ouro_customer_v2", null)
            );
            const [isAdmin, setIsAdmin] = useState(() =>
                Boolean(readStoredJson("ouro_admin_authed_v2", false))
            );

            const [activeModal, setActiveModal] = useState(null);
            const [authTab, setAuthTab] = useState("login");
            const [customerNameInput, setCustomerNameInput] = useState("");
            const [customerEmailInput, setCustomerEmailInput] = useState("");
            const [customerPhoneInput, setCustomerPhoneInput] = useState("");
            const [customerAddressInput, setCustomerAddressInput] = useState("");
            const [authError, setAuthError] = useState("");

            const [adminIdInput, setAdminIdInput] = useState("");
            const [adminPassInput, setAdminPassInput] = useState("");
            const [adminAuthError, setAdminAuthError] = useState("");

            const [toastMessage, setToastMessage] = useState("");
            const [copiedAccount, setCopiedAccount] = useState(false);

            const [chatInput, setChatInput] = useState("");
            const [chatSelectedCustomerEmail, setChatSelectedCustomerEmail] = useState("ALL");
            const chatEndRef = useRef(null);

            const [adminTab, setAdminTab] = useState("orders");
            const [aiCommandInput, setAiCommandInput] = useState("");
            const [aiCommandStatus, setAiCommandStatus] = useState("");
            const [trackingInputs, setTrackingInputs] = useState({});

            const [editBrand, setEditBrand] = useState(watch.brand);
            const [editModel, setEditModel] = useState(watch.model);
            const [editSubtitle, setEditSubtitle] = useState(watch.subtitle);
            const [editPrice, setEditPrice] = useState(String(watch.price));
            const [editStatus, setEditStatus] = useState(watch.status);
            const [editCondition, setEditCondition] = useState(watch.condition);
            const [editImageUrl, setEditImageUrl] = useState(watch.imageUrl);

            const [editBankName, setEditBankName] = useState(config.bankName);
            const [editBankAccount, setEditBankAccount] = useState(config.bankAccount);
            const [editBankHolder, setEditBankHolder] = useState(config.bankHolder);
            const [editThemeAccent, setEditThemeAccent] = useState(config.themeAccent || "gold");
            const [editAnnouncementBanner, setEditAnnouncementBanner] = useState(config.announcementBanner || "");
            const [editChatDelayNotice, setEditChatDelayNotice] = useState(config.chatDelayNotice);

            useEffect(() => {
                setEditBrand(watch.brand);
                setEditModel(watch.model);
                setEditSubtitle(watch.subtitle);
                setEditPrice(String(watch.price));
                setEditStatus(watch.status);
                setEditCondition(watch.condition);
                setEditImageUrl(watch.imageUrl);
            }, [watch]);

            useEffect(() => {
                setEditBankName(config.bankName);
                setEditBankAccount(config.bankAccount);
                setEditBankHolder(config.bankHolder);
                setEditThemeAccent(config.themeAccent || "gold");
                setEditAnnouncementBanner(config.announcementBanner || "");
                setEditChatDelayNotice(config.chatDelayNotice);
            }, [config]);

            useEffect(() => {
                writeStoredJson("ouro_config_v2", config);
            }, [config]);

            useEffect(() => {
                writeStoredJson("ouro_watch_v2", watch);
            }, [watch]);

            useEffect(() => {
                writeStoredJson("ouro_orders_v2", orders);
            }, [orders]);

            useEffect(() => {
                writeStoredJson("ouro_messages_v2", messages);
            }, [messages]);

            useEffect(() => {
                writeStoredJson("ouro_customer_v2", customerSession);
            }, [customerSession]);

            useEffect(() => {
                writeStoredJson("ouro_admin_authed_v2", isAdmin);
            }, [isAdmin]);

            useEffect(() => {
                if (!LIVE_SYNC_CHANNEL) return;
                const handleChannelMsg = (event) => {
                    const payload = event.data;
                    if (!payload || !payload.key) return;
                    if (payload.key === "ouro_config_v2" && payload.value) {
                        setConfig((prev) => ({ ...prev, ...payload.value }));
                    } else if (payload.key === "ouro_watch_v2" && payload.value) {
                        setWatch((prev) => ({
                            ...prev,
                            ...payload.value,
                            imageUrl: normalizeImageSrc(payload.value.imageUrl, prev.imageUrl),
                        }));
                    } else if (payload.key === "ouro_orders_v2" && Array.isArray(payload.value)) {
                        setOrders(payload.value);
                    } else if (payload.key === "ouro_messages_v2" && Array.isArray(payload.value)) {
                        setMessages(payload.value);
                    }
                };
                LIVE_SYNC_CHANNEL.addEventListener("message", handleChannelMsg);
                return () => LIVE_SYNC_CHANNEL.removeEventListener("message", handleChannelMsg);
            }, []);

            function showToast(msg) {
                setToastMessage(msg);
                setTimeout(() => {
                    setToastMessage((prev) => (prev === msg ? "" : prev));
                }, 3200);
            }

            const theme = THEME_PRESETS[config.themeAccent] || THEME_PRESETS.gold;

            const myOrders = useMemo(() => {
                if (!customerSession?.email) return [];
                return orders.filter(
                    (o) => (o.customerEmail || "").toLowerCase() === customerSession.email.toLowerCase()
                );
            }, [orders, customerSession]);

            const visibleMessages = useMemo(() => {
                if (isAdmin) {
                    if (chatSelectedCustomerEmail === "ALL") return messages;
                    return messages.filter(
                        (m) =>
                            m.targetEmail === "ALL" ||
                            (m.customerEmail || "").toLowerCase() === chatSelectedCustomerEmail.toLowerCase() ||
                            (m.targetEmail || "").toLowerCase() === chatSelectedCustomerEmail.toLowerCase()
                    );
                }
                if (!customerSession?.email) {
                    return messages.filter((m) => m.targetEmail === "ALL");
                }
                return messages.filter(
                    (m) =>
                        m.targetEmail === "ALL" ||
                        (m.customerEmail || "").toLowerCase() === customerSession.email.toLowerCase() ||
                        (m.targetEmail || "").toLowerCase() === customerSession.email.toLowerCase()
                );
            }, [messages, isAdmin, chatSelectedCustomerEmail, customerSession]);

            useEffect(() => {
                if (activeModal === "chat" && chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: "smooth" });
                }
            }, [visibleMessages, activeModal]);

            function handleCustomerAuthSubmit(e) {
                e.preventDefault();
                const cleanEmail = customerEmailInput.trim();
                const cleanName = customerNameInput.trim();
                if (!cleanEmail || !cleanEmail.includes("@")) {
                    setAuthError("올바른 이메일 주소를 입력해 주세요.");
                    return;
                }
                if (authTab === "signup" && (!cleanName || !customerPhoneInput.trim())) {
                    setAuthError("회원가입 시 이름과 연락처를 모두 입력해 주세요.");
                    return;
                }
                const sessionObj = {
                    name: cleanName || cleanEmail.split("@")[0],
                    email: cleanEmail,
                    phone: customerPhoneInput.trim() || "010-0000-0000",
                    address: customerAddressInput.trim() || "서울특별시 강남구 테헤란로",
                };
                setCustomerSession(sessionObj);
                setAuthError("");
                setActiveModal(null);
                showToast(`${sessionObj.name}님으로 로그인되었습니다.`);
            }

            function handleCustomerLogout() {
                setCustomerSession(null);
                showToast("로그아웃되었습니다.");
            }

            function handleAdminLoginSubmit(e) {
                e.preventDefault();
                if (adminIdInput.trim() === ADMIN_ID && adminPassInput === ADMIN_PASSCODE) {
                    setIsAdmin(true);
                    setAdminAuthError("");
                    setActiveModal("admin");
                    showToast("관리자 모드로 접속했습니다.");
                } else {
                    setAdminAuthError("관리자 아이디 또는 비밀번호가 일치하지 않습니다.");
                }
            }

            function handleAdminLogout() {
                setIsAdmin(false);
                setActiveModal(null);
                showToast("관리자 로그아웃이 완료되었습니다.");
            }

            function handleCopyAccount() {
                const text = `${config.bankName} ${config.bankAccount} (${config.bankHolder})`;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).catch(() => {});
                }
                setCopiedAccount(true);
                showToast("계좌 정보가 클립보드에 복사되었습니다.");
                setTimeout(() => setCopiedAccount(false), 2000);
            }

            function handleTransferComplete() {
                const activeCustomer = customerSession || {
                    name: "비회원 고객",
                    email: "guest@ouro.com",
                    phone: "010-0000-0000",
                    address: "배송지 미입력 (채팅으로 안내)",
                };
                const newOrder = {
                    id: `ORD-${Date.now().toString().slice(-6)}`,
                    createdAt: formatDateTimeNow(),
                    customerName: activeCustomer.name,
                    customerEmail: activeCustomer.email,
                    customerPhone: activeCustomer.phone,
                    customerAddress: activeCustomer.address,
                    watchModel: `${watch.brand} · ${watch.model}`,
                    amount: Number(watch.price) || 0,
                    status: "계좌이체 완료 · 확인대기",
                    trackingNumber: "",
                };
                setOrders((prev) => [newOrder, ...prev]);

                const systemMsg = {
                    id: `msg-${Date.now()}`,
                    sender: "customer",
                    senderName: activeCustomer.name,
                    customerEmail: activeCustomer.email,
                    targetEmail: activeCustomer.email,
                    text: `[계좌이체 완료 알림] ${activeCustomer.name}님이 ${formatKRW(newOrder.amount)} 계좌이체를 완료했습니다. (주문번호: ${newOrder.id})`,
                    timestamp: formatTimeNow(),
                };
                setMessages((prev) => [...prev, systemMsg]);
                showToast("계좌이체 완료가 접수되었습니다! 관리자 알림 및 채팅에 등록되었습니다.");
            }

            function handleSendChatMessage(e) {
                e.preventDefault();
                const trimmed = chatInput.trim();
                if (!trimmed) return;

                if (isAdmin) {
                    const target = chatSelectedCustomerEmail || "ALL";
                    const msg = {
                        id: `msg-${Date.now()}`,
                        sender: "admin",
                        senderName: "OURO 관리자",
                        customerEmail: target === "ALL" ? "ALL" : target,
                        targetEmail: target,
                        text: trimmed,
                        timestamp: formatTimeNow(),
                    };
                    setMessages((prev) => [...prev, msg]);
                } else {
                    const senderEmail = customerSession?.email || "guest@ouro.com";
                    const senderName = customerSession?.name || "방문 고객";
                    const msg = {
                        id: `msg-${Date.now()}`,
                        sender: "customer",
                        senderName,
                        customerEmail: senderEmail,
                        targetEmail: senderEmail,
                        text: trimmed,
                        timestamp: formatTimeNow(),
                    };
                    setMessages((prev) => [...prev, msg]);
                }
                setChatInput("");
            }

            function handleImageFileUpload(e) {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    if (typeof reader.result === "string") {
                        setEditImageUrl(reader.result);
                        setWatch((prev) => ({ ...prev, imageUrl: reader.result }));
                        showToast("시계 이미지가 업로드되어 반영되었습니다.");
                    }
                };
                reader.readAsDataURL(file);
            }

            function handleSaveWatchAndBank(e) {
                e.preventDefault();
                setWatch((prev) => ({
                    ...prev,
                    brand: editBrand.trim() || prev.brand,
                    model: editModel.trim() || prev.model,
                    subtitle: editSubtitle.trim() || prev.subtitle,
                    price: Math.max(0, Number(editPrice) || 0),
                    status: editStatus,
                    condition: editCondition.trim() || prev.condition,
                    imageUrl: normalizeImageSrc(editImageUrl, prev.imageUrl),
                }));
                setConfig((prev) => ({
                    ...prev,
                    bankName: editBankName.trim() || prev.bankName,
                    bankAccount: editBankAccount.trim() || prev.bankAccount,
                    bankHolder: editBankHolder.trim() || prev.bankHolder,
                    themeAccent: editThemeAccent,
                    announcementBanner: editAnnouncementBanner,
                    chatDelayNotice: editChatDelayNotice.trim() || prev.chatDelayNotice,
                }));
                showToast("시계 정보 및 부티크 설정이 저장되었습니다.");
            }

            function handleUpdateOrderStatus(orderId, nextStatus) {
                setOrders((prev) =>
                    prev.map((o) => (o.id === orderId ? { ...o, status: nextStatus } : o))
                );
                showToast(`주문 ${orderId} 상태가 '${nextStatus}'로 변경되었습니다.`);
            }

            function handleSaveTracking(orderId) {
                const trackNum = (trackingInputs[orderId] || "").trim();
                if (!trackNum) {
                    showToast("운송장 번호를 입력해 주세요.");
                    return;
                }
                setOrders((prev) =>
                    prev.map((o) =>
                        o.id === orderId
                            ? { ...o, trackingNumber: trackNum, status: "택배 발송 완료" }
                            : o
                    )
                );
                showToast(`운송장(${trackNum})이 등록되고 택배 발송 완료 처리되었습니다.`);
            }

            function handleApplyAiCommand(e) {
                e.preventDefault();
                if (!aiCommandInput.trim()) return;
                const result = runLocalSiteEditor(aiCommandInput, config, watch);
                if (result.configUpdates && Object.keys(result.configUpdates).length > 0) {
                    setConfig((prev) => ({ ...prev, ...result.configUpdates }));
                }
                if (result.watchUpdates && Object.keys(result.watchUpdates).length > 0) {
                    setWatch((prev) => ({ ...prev, ...result.watchUpdates }));
                }
                setAiCommandStatus(`반영 완료: ${result.summary}`);
                setAiCommandInput("");
                showToast("실시간 사이트 변경이 적용되었습니다.");
            }

            const uniqueCustomers = useMemo(() => {
                const map = new Map();
                orders.forEach((o) => {
                    if (o.customerEmail) {
                        map.set(o.customerEmail.toLowerCase(), {
                            email: o.customerEmail,
                            name: o.customerName || o.customerEmail,
                        });
                    }
                });
                messages.forEach((m) => {
                    if (m.customerEmail && m.customerEmail !== "ALL") {
                        map.set(m.customerEmail.toLowerCase(), {
                            email: m.customerEmail,
                            name: m.sender === "customer" ? m.senderName : m.customerEmail,
                        });
                    }
                });
                return Array.from(map.values());
            }, [orders, messages]);

            return (
                <div className="min-h-screen bg-obsidian text-stone-100 flex flex-col">
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 max-w-sm rounded-xl border border-amber-500/40 bg-zinc-950/95 px-4 py-3 text-xs text-amber-200 shadow-2xl backdrop-blur animate-fade-up flex items-center gap-2.5">
                            <CircleCheck className={`w-4 h-4 shrink-0 ${theme.primaryText}`} />
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {config.announcementBanner && (
                        <div className="bg-gradient-to-r from-amber-500/20 via-amber-400/25 to-amber-500/20 border-b border-amber-500/30 px-4 py-2 text-center text-xs text-amber-200">
                            <span className="font-semibold mr-2">[NOTICE]</span>
                            <span>{config.announcementBanner}</span>
                        </div>
                    )}

                    <header className="sticky top-0 z-30 border-b border-zinc-800/80 bg-obsidian/90 backdrop-blur-md">
                        <div className="mx-auto flex max-w-6xl items-center justify-between px-4 py-3.5 sm:px-6">
                            <div className="flex items-center gap-3">
                                <button
                                    onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
                                    className="flex items-center gap-2.5 text-left"
                                >
                                    <span className={`font-serif text-xl tracking-[0.22em] font-semibold ${theme.primaryText}`}>
                                        {config.brandLogo}
                                    </span>
                                    <span className="hidden sm:inline-block text-[11px] tracking-widest text-zinc-400 uppercase border-l border-zinc-800 pl-3">
                                        {config.topBannerSubtitle}
                                    </span>
                                </button>
                            </div>

                            <div className="flex items-center gap-2 sm:gap-2.5">
                                {customerSession ? (
                                    <div className="flex items-center gap-1.5">
                                        <button
                                            onClick={() => setActiveModal("myOrders")}
                                            className="inline-flex items-center gap-1.5 rounded-full border border-zinc-700 bg-zinc-900/90 px-3 py-1.5 text-xs text-stone-200 hover:border-amber-500/50 transition"
                                        >
                                            <ClipboardList className="w-3.5 h-3.5 text-amber-400" />
                                            <span className="hidden md:inline">{customerSession.name}</span>
                                            <span>내 주문 ({myOrders.length})</span>
                                        </button>
                                        <button
                                            onClick={handleCustomerLogout}
                                            className="inline-flex items-center gap-1 rounded-full border border-zinc-800 bg-zinc-900/60 px-2.5 py-1.5 text-xs text-zinc-400 hover:text-stone-200 transition"
                                            title="로그아웃"
                                        >
                                            <LogOut className="w-3.5 h-3.5" />
                                        </button>
                                    </div>
                                ) : (
                                    <button
                                        onClick={() => {
                                            setAuthTab("login");
                                            setAuthError("");
                                            setActiveModal("customerAuth");
                                        }}
                                        className="inline-flex items-center gap-1.5 rounded-full border border-zinc-700 bg-zinc-900/90 px-3 py-1.5 text-xs text-stone-200 hover:border-amber-500/50 transition"
                                    >
                                        <User className="w-3.5 h-3.5 text-amber-400" />
                                        <span>로그인 / 가입</span>
                                    </button>
                                )}

                                <button
                                    onClick={() => setActiveModal("chat")}
                                    className="inline-flex items-center gap-1.5 rounded-full border border-zinc-700 bg-zinc-900/90 px-3 py-1.5 text-xs text-stone-200 hover:border-amber-500/50 transition"
                                >
                                    <MessageSquare className="w-3.5 h-3.5 text-amber-400" />
                                    <span>1:1 채팅</span>
                                </button>

                                {isAdmin ? (
                                    <button
                                        onClick={() => setActiveModal("admin")}
                                        className={`inline-flex items-center gap-1.5 rounded-full bg-gradient-to-r ${theme.btnGrad} px-3.5 py-1.5 text-xs font-semibold shadow-lg transition`}
                                    >
                                        <Lock className="w-3.5 h-3.5" />
                                        <span>관리자 콘솔</span>
                                    </button>
                                ) : (
                                    <button
                                        onClick={() => {
                                            setAdminAuthError("");
                                            setActiveModal("adminLogin");
                                        }}
                                        className="inline-flex items-center gap-1.5 rounded-full border border-zinc-800 bg-zinc-900/70 px-3 py-1.5 text-xs text-zinc-300 hover:border-zinc-600 transition"
                                    >
                                        <Lock className="w-3.5 h-3.5 text-zinc-400" />
                                        <span>관리자</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="flex-1">
                        <section className="relative overflow-hidden border-b border-zinc-800/70 bg-gradient-to-b from-burgundy/25 via-obsidian to-obsidian py-12 sm:py-16">
                            <div className="mx-auto grid max-w-6xl grid-cols-1 gap-10 px-4 sm:px-6 lg:grid-cols-12 lg:items-center">
                                <div className="lg:col-span-6 space-y-6 animate-fade-up">
                                    <div className={`inline-flex items-center gap-2 rounded-full border px-3.5 py-1 text-[11px] tracking-[0.2em] uppercase ${theme.badgeBg}`}>
                                        <Sparkles className="w-3.5 h-3.5" />
                                        <span>{config.heroKicker}</span>
                                    </div>

                                    <div className="space-y-2">
                                        <p className="text-xs tracking-[0.25em] text-zinc-400 uppercase">
                                            {watch.brand} · REF. {watch.reference}
                                        </p>
                                        <h1 className="font-serif text-3xl sm:text-5xl font-semibold tracking-tight text-stone-50 leading-tight">
                                            {watch.model}
                                        </h1>
                                        <p className="font-krserif text-sm sm:text-base text-zinc-300 leading-relaxed">
                                            {watch.subtitle}
                                        </p>
                                    </div>

                                    <div className="flex flex-wrap items-baseline gap-4 pt-1">
                                        <span className={`text-3xl sm:text-4xl font-bold tracking-tight ${theme.primaryText}`}>
                                            {formatKRW(watch.price)}
                                        </span>
                                        <span className="rounded-full border border-emerald-500/30 bg-emerald-950/50 px-3 py-1 text-xs font-medium text-emerald-300">
                                            {watch.status}
                                        </span>
                                        <span className="text-xs text-zinc-400">{watch.condition}</span>
                                    </div>

                                    <div className="rounded-2xl border border-zinc-800 bg-surface/90 p-4 sm:p-5 space-y-3">
                                        <div className="flex items-center justify-between gap-2">
                                            <span className="text-xs font-semibold tracking-wider text-zinc-400 uppercase">
                                                DIRECT BANK TRANSFER · 계좌이체 안내
                                            </span>
                                            <button
                                                onClick={handleCopyAccount}
                                                className="inline-flex items-center gap-1 rounded-lg border border-zinc-700 bg-zinc-900 px-2.5 py-1 text-xs text-stone-200 hover:border-amber-500/50 transition"
                                            >
                                                {copiedAccount ? (
                                                    <>
                                                        <Check className="w-3.5 h-3.5 text-emerald-400" />
                                                        <span>복사됨</span>
                                                    </>
                                                ) : (
                                                    <>
                                                        <Copy className="w-3.5 h-3.5 text-amber-400" />
                                                        <span>계좌 복사</span>
                                                    </>
                                                )}
                                            </button>
                                        </div>
                                        <div className="flex flex-wrap items-center justify-between gap-2 text-sm">
                                            <div>
                                                <span className="text-zinc-400 mr-2">{config.bankName}</span>
                                                <span className="font-mono text-base sm:text-lg font-semibold text-stone-100">
                                                    {config.bankAccount}
                                                </span>
                                            </div>
                                            <span className="text-xs text-zinc-400">
                                                예금주: <strong className="text-stone-200">{config.bankHolder}</strong>
                                            </span>
                                        </div>
                                    </div>

                                    <div className="flex flex-col sm:flex-row gap-3 pt-1">
                                        <button
                                            onClick={handleTransferComplete}

                                                            </span>
                                                        </div>
                                                        <div className="flex flex-wrap items-center justify-between gap-2 text-zinc-300">
                                                            <span>{ord.watchModel} · <strong>{formatKRW(ord.amount)}</strong></span>
                                                            <div className="flex flex-wrap gap-1.5">
                                                                <button
                                                                    onClick={() => handleUpdateOrderStatus(ord.id, "입금 확인 완료 · 발송 준비")}
                                                                    className="rounded-lg border border-sky-700/60 bg-sky-950/50 px-2.5 py-1 text-sky-300 hover:bg-sky-900/60"
                                                                >
                                                                    입금 확인
                                                                </button>
                                                                <button
                                                                    onClick={() => handleUpdateOrderStatus(ord.id, "택배 발송 완료")}
                                                                    className="rounded-lg border border-emerald-700/60 bg-emerald-950/50 px-2.5 py-1 text-emerald-300 hover:bg-emerald-900/60"
                                                                >
                                                                    발송 완료
                                                                </button>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-2 pt-1">
                                                            <input
                                                                type="text"
                                                                value={trackingInputs[ord.id] ?? ord.trackingNumber ?? ""}
                                                                onChange={(e) =>
                                                                    setTrackingInputs((prev) => ({ ...prev, [ord.id]: e.target.value }))
                                                                }
                                                                placeholder="택배 운송장 번호 입력"
                                                                className="flex-1 rounded-lg border border-zinc-800 bg-zinc-900 px-3 py-1.5 text-stone-100"
                                                            />
                                                            <button
                                                                onClick={() => handleSaveTracking(ord.id)}
                                                                className="rounded-lg bg-zinc-800 px-3 py-1.5 text-stone-100 hover:bg-zinc-700"
                                                            >
                                                                운송장 등록
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    )}

                                    {adminTab === "catalog" && (
                                        <form onSubmit={handleSaveWatchAndBank} className="grid grid-cols-1 sm:grid-cols-2 gap-4 rounded-2xl border border-zinc-800 bg-zinc-950/70 p-4">
                                            <div>
                                                <label className="block text-zinc-400 mb-1">브랜드명</label>
                                                <input
                                                    type="text"
                                                    value={editBrand}
                                                    onChange={(e) => setEditBrand(e.target.value)}
                                                    className="w-full rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-2 text-stone-100"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-zinc-400 mb-1">모델명</label>
                                                <input
                                                    type="text"
                                                    value={editModel}
                                                    onChange={(e) => setEditModel(e.target.value)}
                                                    className="w-full rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-2 text-stone-100"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-zinc-400 mb-1">판매가 (원)</label>
                                                <input
                                                    type="number"
                                                    value={editPrice}
                                                    onChange={(e) => setEditPrice(e.target.value)}
                                                    className="w-full rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-2 text-stone-100"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-zinc-400 mb-1">판매 상태</label>
                                                <select
                                                    value={editStatus}
                                                    onChange={(e) => setEditStatus(e.target.value)}
                                                    className="w-full rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-2 text-stone-100"
                                                >
                                                    <option value="판매중">판매중</option>
                                                    <option value="예약중">예약중</option>
                                                    <option value="판매완료">판매완료</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-zinc-400 mb-1">은행명</label>
                                                <input
                                                    type="text"
                                                    value={editBankName}
                                                    onChange={(e) => setEditBankName(e.target.value)}
                                                    className="w-full rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-2 text-stone-100"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-zinc-400 mb-1">계좌번호</label>
                                                <input
                                                    type="text"
                                                    value={editBankAccount}
                                                    onChange={(e) => setEditBankAccount(e.target.value)}
                                                    className="w-full rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-2 text-stone-100"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-zinc-400 mb-1">예금주</label>
                                                <input
                                                    type="text"
                                                    value={editBankHolder}
                                                    onChange={(e) => setEditBankHolder(e.target.value)}
                                                    className="w-full rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-2 text-stone-100"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-zinc-400 mb-1">컬러 테마</label>
                                                <select
                                                    value={editThemeAccent}
                                                    onChange={(e) => setEditThemeAccent(e.target.value)}
                                                    className="w-full rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-2 text-stone-100"
                                                >
                                                    {Object.entries(THEME_PRESETS).map(([k, v]) => (
                                                        <option key={k} value={k}>{v.label}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div className="sm:col-span-2">
                                                <label className="block text-zinc-400 mb-1">시계 이미지 파일 업로드 (또는 URL)</label>
                                                <div className="flex flex-col sm:flex-row gap-2">
                                                    <input
                                                        type="text"
                                                        value={editImageUrl}
                                                        onChange={(e) => setEditImageUrl(e.target.value)}
                                                        className="flex-1 rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-2 text-stone-100"
                                                    />
                                                    <label className="inline-flex items-center justify-center gap-1.5 rounded-xl border border-zinc-700 bg-zinc-800 px-3.5 py-2 text-stone-200 cursor-pointer hover:bg-zinc-700">
                                                        <Paperclip className="w-3.5 h-3.5" />
                                                        <span>파일 선택</span>
                                                        <input type="file" accept="image/*" onChange={handleImageFileUpload} className="hidden" />
                                                    </label>
                                                </div>
                                            </div>
                                            <div className="sm:col-span-2">
                                                <label className="block text-zinc-400 mb-1">상단 공지 배너 (비워두면 숨김)</label>
                                                <input
                                                    type="text"
                                                    value={editAnnouncementBanner}
                                                    onChange={(e) => setEditAnnouncementBanner(e.target.value)}
                                                    placeholder="예: 11월 한정 무료 특급 배송 이벤트 진행 중"
                                                    className="w-full rounded-xl border border-zinc-800 bg-zinc-900 px-3 py-2 text-stone-100"
                                                />
                                            </div>
                                            <div className="sm:col-span-2 flex justify-end pt-2">
                                                <button
                                                    type="submit"
                                                    className={`rounded-xl bg-gradient-to-r ${theme.btnGrad} px-6 py-2.5 font-bold`}
                                                >
                                                    변경사항 저장
                                                </button>
                                            </div>
                                        </form>
                                    )}

                                    {adminTab === "aiEdit" && (
                                        <div className="rounded-2xl border border-zinc-800 bg-zinc-950/70 p-5 space-y-4">
                                            <p className="text-zinc-300 leading-relaxed">
                                                원하는 변경 내용을 자연어로 입력하세요. 예: <span className="text-amber-300">"가격 550만원으로 바꿔줘"</span>, <span className="text-amber-300">"에메랄드 테마로 변경"</span>, <span className="text-amber-300">"상태 예약중으로 해줘"</span>
                                            </p>
                                            <form onSubmit={handleApplyAiCommand} className="flex gap-2">
                                                <input
                                                    type="text"
                                                    value={aiCommandInput}
                                                    onChange={(e) => setAiCommandInput(e.target.value)}
                                                    placeholder="예: 사파이어 테마로 변경하고 가격을 2500000원으로 바꿔줘"
                                                    className="flex-1 rounded-xl border border-zinc-800 bg-zinc-900 px-3.5 py-2.5 text-stone-100"
                                                />
                                                <button
                                                    type="submit"
                                                    className={`rounded-xl bg-gradient-to-r ${theme.btnGrad} px-5 py-2.5 font-bold`}
                                                >
                                                    즉시 적용
                                                </button>
                                            </form>
                                            {aiCommandStatus && (
                                                <div className="rounded-xl border border-emerald-500/30 bg-emerald-950/40 p-3 text-emerald-300">
                                                    {aiCommandStatus}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<OuroAtelierApp />);
    </script>
</body>
</html>
